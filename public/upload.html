        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0b0f19;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(
                    circle at 15% 0%,
                    rgba(59,130,246,.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 8%,
                    rgba(139,92,246,.10),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(6,182,212,.055),
                    transparent 32%
                );
            z-index: -1;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(24,31,45,.68);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(148,163,184,.085);
            box-shadow: 0 16px 45px -24px rgba(0,0,0,.75);
            border-radius: 1.25rem;
        }

        nav.glass-card {
            border-radius: 0;
            border-top: 0;
            border-left: 0;
            border-right: 0;
        }

        #sidebar {
            background: rgba(17,24,39,.84);
            border-right: 1px solid rgba(148,163,184,.09);
            box-shadow: 18px 0 50px -35px rgba(0,0,0,.9);
            transition: transform 0.3s ease-in-out;
        }

        .sidebar-open {
            transform: translateX(0);
        }

        .sidebar-closed {
            transform: translateX(-100%);
        }

        @media (min-width: 1024px) {
            #sidebar {
                transform: translateX(0);
            }
        }

        .dropdown-menu {
            display: none;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }

        .profile-dropdown-container.active .dropdown-menu {
            display: block;
            opacity: 1;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.2);
            border-top-color: #22d3ee;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        textarea::-webkit-scrollbar {
            width: 6px;
        }

        textarea::-webkit-scrollbar-track {
            background: transparent;
        }

        textarea::-webkit-scrollbar-thumb {
            background: rgba(148,163,184,.2);
            border-radius: 10px;
        }

        .processing-row {
            animation: processingIn .25s ease-out;
        }

        @keyframes processingIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

    <script>

        /* =====================================================
           SIDEBAR
        ====================================================== */

        function toggleSidebar() {

            const sidebar =
                document.getElementById("sidebar");

            const overlay =
                document.getElementById("sidebar-overlay");

            if (
                window.matchMedia("(min-width: 1024px)").matches
            ) {
                return;
            }

            if (
                sidebar.classList.contains("sidebar-closed")
            ) {

                sidebar.classList.remove(
                    "sidebar-closed"
                );

                sidebar.classList.add(
                    "sidebar-open"
                );

                overlay.classList.remove("hidden");

            } else {

                sidebar.classList.remove(
                    "sidebar-open"
                );

                sidebar.classList.add(
                    "sidebar-closed"
                );

                overlay.classList.add("hidden");

            }

        }


        /* =====================================================
           PROFILE DROPDOWN
        ====================================================== */

        function toggleDropdown(event) {

            event.stopPropagation();

            const container =
                document.querySelector(
                    ".profile-dropdown-container"
                );

            if (!container) {
                return;
            }

            container.classList.toggle("active");

        }


        document.addEventListener(
            "click",
            function(event) {

                const container =
                    document.querySelector(
                        ".profile-dropdown-container"
                    );

                if (
                    container &&
                    container.classList.contains("active") &&
                    !container.contains(event.target)
                ) {

                    container.classList.remove(
                        "active"
                    );

                }

            }
        );


        /* =====================================================
           COMING SOON
        ====================================================== */

        function showComingSoon(name) {

            alert(
                name + " is coming soon."
            );

        }


        /* =====================================================
           TAB SWITCHING
        ====================================================== */

        function switchTab(tab) {

            const linksTabBtn =
                document.getElementById("tab-links");

            const folderTabBtn =
                document.getElementById("tab-folder");

            const linksView =
                document.getElementById("view-links");

            const folderView =
                document.getElementById("view-folder");


            if (tab === "links") {

                linksTabBtn.className =
                    "text-cyan-400 font-semibold border-b-2 border-cyan-400 px-1 pb-2 transition";

                folderTabBtn.className =
                    "text-gray-400 hover:text-gray-300 font-medium px-1 pb-2 transition";

                linksView.classList.remove("hidden");

                folderView.classList.add("hidden");

            } else {

                folderTabBtn.className =
                    "text-cyan-400 font-semibold border-b-2 border-cyan-400 px-1 pb-2 transition";

                linksTabBtn.className =
                    "text-gray-400 hover:text-gray-300 font-medium px-1 pb-2 transition";

                folderView.classList.remove("hidden");

                linksView.classList.add("hidden");

            }

        }


        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =====================================================
           CREATE PROCESSING ROW
        ====================================================== */

        function createFileRow(
            fileName
        ) {

            const row =
                document.createElement("div");

            row.className =
                "processing-row bg-[#0a0e17] border border-gray-700/50 rounded-lg p-4 flex flex-col md:flex-row md:items-center justify-between gap-3";


            row.innerHTML = `

                <div class="flex items-center gap-3 w-full md:w-auto">

                    <svg
                        class="w-5 h-5 text-gray-500 shrink-0"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"
                        ></path>
                    </svg>

                    <span
                        data-file-name
                        class="text-sm text-gray-300 font-medium truncate max-w-[200px] md:max-w-xs"
                    >
                        ${escapeHtml(fileName || "Fetching info...")}
                    </span>

                </div>


                <div
                    data-status
                    class="flex items-center gap-2 text-xs text-cyan-400 font-medium shrink-0"
                >

                    <div class="spinner"></div>

                    Processing

                </div>


                <div
                    data-result
                    class="hidden items-center gap-2 w-full md:w-auto"
                >

                    <input
                        type="text"
                        readonly
                        data-link
                        value=""
                        class="bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-emerald-400 text-xs font-mono outline-none w-full md:w-48"
                    >

                    <button
                        type="button"
                        data-copy
                        class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-xs font-semibold transition shrink-0"
                    >
                        Copy
                    </button>

                </div>

            `;


            row.querySelector("[data-copy]")
                .addEventListener(
                    "click",
                    function() {

                        copyLink(
                            row.querySelector("[data-link]"),
                            this
                        );

                    }
                );


            return row;

        }


        /* =====================================================
           DRIVE FILENAME
        ====================================================== */

        function extractDriveFileName(url) {

            try {

                const match =
                    url.match(/\/d\/([^/]+)/);

                if (match) {
                    return "Google Drive File";
                }

            } catch {}

            return "Google Drive File";

        }


        /* =====================================================
           EXTRACT SHORT LINK FROM WORKER RESPONSE
        ====================================================== */

        function getShortLink(data) {

            const uploadData =
                data?.data || data || {};


            return (
                uploadData.short_link ||
                uploadData.short_url ||
                uploadData.url ||
                uploadData.download_url ||
                uploadData.file_url ||
                (
                    uploadData.short_id
                        ? `${window.location.origin}/file/${encodeURIComponent(uploadData.short_id)}`
                        : ""
                )
            );

        }


        /* =====================================================
           UPLOAD ONE FILE
        ====================================================== */

        async function uploadOne(
            driveUrl,
            row
        ) {

            try {

                const response =
                    await fetch(
                        "/api/upload",
                        {
                            method: "POST",

                            credentials: "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                drive_url: driveUrl
                            })
                        }
                    );


                let data;

                try {

                    data =
                        await response.json();

                } catch {

                    data = null;

                }


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    window.location.href = "/";

                    return false;

                }


                if (
                    !response.ok ||
                    !data ||
                    data.status !== "success"
                ) {

                    const status =
                        row.querySelector(
                            "[data-status]"
                        );


                    status.innerHTML = `

                        <span class="text-red-400">
                            Failed
                        </span>

                    `;


                    status.classList.remove(
                        "text-cyan-400"
                    );

                    status.classList.add(
                        "text-red-400"
                    );


                    return false;

                }


                const uploadData =
                    data.data || data;


                /* Real filename from worker */
                if (uploadData.file_name) {

                    const nameElement =
                        row.querySelector(
                            "[data-file-name]"
                        );

                    nameElement.textContent =
                        uploadData.file_name;

                    nameElement.title =
                        uploadData.file_name;

                    nameElement.classList.remove(
                        "text-gray-300"
                    );

                    nameElement.classList.add(
                        "text-white"
                    );

                }


                /* Real short link from worker */
                const shortLink =
                    getShortLink(data);


                if (!shortLink) {

                    const status =
                        row.querySelector(
                            "[data-status]"
                        );

                    status.innerHTML = `
                        <span class="text-red-400">
                            No link returned
                        </span>
                    `;

                    status.classList.remove(
                        "text-cyan-400"
                    );

                    status.classList.add(
                        "text-red-400"
                    );

                    return false;

                }


                const status =
                    row.querySelector(
                        "[data-status]"
                    );

                const result =
                    row.querySelector(
                        "[data-result]"
                    );

                const linkInput =
                    row.querySelector(
                        "[data-link]"
                    );


                status.classList.add(
                    "hidden"
                );


                linkInput.value =
                    shortLink;


                result.classList.remove(
                    "hidden"
                );

                result.classList.add(
                    "flex"
                );


                return true;


            } catch (error) {

                console.error(
                    "Upload error:",
                    error
                );


                const status =
                    row.querySelector(
                        "[data-status]"
                    );


                status.innerHTML = `
                    <span class="text-red-400">
                        Failed
                    </span>
                `;


                status.classList.remove(
                    "text-cyan-400"
                );

                status.classList.add(
                    "text-red-400"
                );


                return false;

            }

        }


        /* =====================================================
           START UPLOAD
        ====================================================== */

        async function startUpload() {

            const driveLinks =
                document.getElementById(
                    "driveLinks"
                ).value.trim();


            const folderLink =
                document.getElementById(
                    "folderLink"
                ).value.trim();


            const linksView =
                document.getElementById(
                    "view-links"
                );


            const isLinksTab =
                !linksView.classList.contains(
                    "hidden"
                );


            let uploadLinks = [];


            if (isLinksTab) {

                uploadLinks =
                    driveLinks
                        .split(/\r?\n/)
                        .map(link => link.trim())
                        .filter(Boolean);


                if (uploadLinks.length === 0) {

                    alert(
                        "Please enter a valid Google Drive link."
                    );

                    return;

                }

            } else {

                if (!folderLink) {

                    alert(
                        "Please enter a valid Google Drive folder link."
                    );

                    return;

                }


                uploadLinks = [
                    folderLink
                ];

            }


            const button =
                document.getElementById(
                    "uploadBtn"
                );


            const processingArea =
                document.getElementById(
                    "processing-area"
                );


            button.disabled = true;

            button.innerHTML = `

                <div class="spinner border-t-white"></div>

                <span>Uploading...</span>

            `;


            button.classList.add(
                "opacity-80",
                "cursor-wait"
            );


            processingArea.innerHTML = "";

            processingArea.classList.remove(
                "hidden"
            );


            let successCount = 0;


            /*
             * Create rows first.
             */
            const rows = [];


            uploadLinks.forEach(
                function(url) {

                    const row =
                        createFileRow(
                            extractDriveFileName(url)
                        );

                    processingArea.appendChild(
                        row
                    );

                    rows.push(row);

                }
            );


            /*
             * Use the real Worker endpoint.
             */
            for (
                let i = 0;
                i < uploadLinks.length;
                i++
            ) {

                const success =
                    await uploadOne(
                        uploadLinks[i],
                        rows[i]
                    );


                if (success) {
                    successCount++;
                }

            }


            button.disabled = false;

            button.classList.remove(
                "opacity-80",
                "cursor-wait"
            );


            if (
                successCount ===
                uploadLinks.length
            ) {

                button.innerHTML = `

                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M5 13l4 4L19 7"
                        ></path>
                    </svg>

                    <span>Upload Complete</span>

                `;

                button.classList.remove(
                    "from-blue-600",
                    "to-cyan-500"
                );

                button.classList.add(
                    "from-emerald-600",
                    "to-teal-500"
                );

            } else if (successCount > 0) {

                button.innerHTML = `

                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M5 13l4 4L19 7"
                        ></path>
                    </svg>

                    <span>Upload Finished</span>

                `;

            } else {

                button.innerHTML = `

                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1
                            m-4-8l-4-4m0 0L8 8m4-4v12"
                        ></path>
                    </svg>

                    <span>Try Again</span>

                `;

            }

        }


        /* =====================================================
           COPY LINK
        ====================================================== */

        async function copyLink(
            input,
            button
        ) {

            if (
                !input ||
                !input.value
            ) {
                return;
            }


            const originalText =
                button.innerText;


            try {

                if (
                    navigator.clipboard &&
                    window.isSecureContext
                ) {

                    await navigator.clipboard.writeText(
                        input.value
                    );

                } else {

                    input.select();

                    document.execCommand(
                        "copy"
                    );

                }


                button.innerText =
                    "Copied!";

                button.classList.add(
                    "bg-emerald-600"
                );


                setTimeout(
                    function() {

                        button.innerText =
                            originalText;

                        button.classList.remove(
                            "bg-emerald-600"
                        );

                    },
                    1500
                );


            } catch (error) {

                console.error(
                    "Copy failed:",
                    error
                );

            }

        }


        /* =====================================================
           LOAD LOGGED-IN USER
        ====================================================== */

        async function loadUser() {

            try {

                const response =
                    await fetch(
                        "/api/me",
                        {
                            method: "GET",
                            credentials: "include"
                        }
                    );


                if (!response.ok) {

                    window.location.href =
                        "/";

                    return;

                }


                const data =
                    await response.json();


                if (
                    !data ||
                    data.status !== "success"
                ) {

                    window.location.href =
                        "/";

                    return;

                }


                const user =
                    data.data ||
                    data.user ||
                    data;


                const name =
                    user.name ||
                    user.full_name ||
                    user.username ||
                    "S-Cloud User";


                document.getElementById(
                    "profileName"
                ).textContent = name;


            } catch (error) {

                console.error(
                    "User load error:",
                    error
                );

                window.location.href =
                    "/";

            }

        }


        /* =====================================================
           LOGOUT
        ====================================================== */

        async function logout() {

            try {

                await fetch(
                    "/api/logout",
                    {
                        method: "POST",
                        credentials: "include"
                    }
                );

            } catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

            }


            window.location.href = "/";

        }


        /* =====================================================
           INITIALIZE
        ====================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                loadUser();

            }
        );

    </script>

</body>
