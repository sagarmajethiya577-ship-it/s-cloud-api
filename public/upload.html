<head>
    <meta charset="UTF-8">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0b0f19;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(
                    circle at 15% 0%,
                    rgba(59,130,246,.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 8%,
                    rgba(139,92,246,.10),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(6,182,212,.055),
                    transparent 32%
                );
            z-index: -1;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(24,31,45,.68);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(148,163,184,.085);
            box-shadow: 0 16px 45px -24px rgba(0,0,0,.75);
            border-radius: 1.25rem;
        }

        nav.glass-card {
            border-radius: 0;
            border-top: 0;
            border-left: 0;
            border-right: 0;
        }

        #sidebar {
            background: rgba(17,24,39,.84);
            border-right: 1px solid rgba(148,163,184,.09);
            box-shadow: 18px 0 50px -35px rgba(0,0,0,.9);
            transition: transform .3s ease-in-out;
        }

        .sidebar-open {
            transform: translateX(0);
        }

        .sidebar-closed {
            transform: translateX(-100%);
        }

        @media (min-width: 1024px) {
            #sidebar {
                transform: translateX(0);
            }
        }

        .dropdown-menu {
            display: none;
            opacity: 0;
            transform: translateY(-4px);
            transition:
                opacity .2s ease,
                transform .2s ease;
        }

        .profile-dropdown-container.active .dropdown-menu {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.2);
            border-top-color: #22d3ee;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        textarea::-webkit-scrollbar {
            width: 6px;
        }

        textarea::-webkit-scrollbar-track {
            background: transparent;
        }

        textarea::-webkit-scrollbar-thumb {
            background: rgba(148,163,184,.2);
            border-radius: 10px;
        }

        .processing-row {
            animation: rowIn .25s ease-out;
        }

        @keyframes rowIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast {
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition:
                opacity .25s ease,
                transform .25s ease;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .result-input {
            min-width: 0;
        }

        @media (max-width: 640px) {
            .result-input {
                width: 100%;
            }
        }
    </style>
</head>

    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->
    <script>

        /* ======================================================
           GLOBAL STATE
        ====================================================== */

        let toastTimer = null;
        let isUploading = false;


        /* ======================================================
           SIDEBAR
        ====================================================== */

        function openSidebar() {

            const sidebar =
                document.getElementById("sidebar");

            const overlay =
                document.getElementById("sidebar-overlay");

            sidebar.classList.remove("sidebar-closed");
            sidebar.classList.add("sidebar-open");

            if (window.matchMedia("(max-width: 1023px)").matches) {
                overlay.classList.remove("hidden");
            }
        }


        function closeSidebar() {

            const sidebar =
                document.getElementById("sidebar");

            const overlay =
                document.getElementById("sidebar-overlay");

            if (window.matchMedia("(min-width: 1024px)").matches) {
                overlay.classList.add("hidden");
                return;
            }

            sidebar.classList.remove("sidebar-open");
            sidebar.classList.add("sidebar-closed");

            overlay.classList.add("hidden");
        }


        function toggleSidebar() {

            if (window.matchMedia("(min-width: 1024px)").matches) {
                return;
            }

            const sidebar =
                document.getElementById("sidebar");

            if (sidebar.classList.contains("sidebar-closed")) {
                openSidebar();
            } else {
                closeSidebar();
            }
        }


        window.addEventListener("resize", () => {

            const overlay =
                document.getElementById("sidebar-overlay");

            if (window.matchMedia("(min-width: 1024px)").matches) {
                overlay.classList.add("hidden");
            }

        });


        /* ======================================================
           PROFILE DROPDOWN
        ====================================================== */

        function toggleDropdown(event) {

            event.stopPropagation();

            const container =
                document.querySelector(".profile-dropdown-container");

            if (!container) {
                return;
            }

            container.classList.toggle("active");
        }


        document.addEventListener("click", function(event) {

            const container =
                document.querySelector(".profile-dropdown-container");

            if (
                container &&
                container.classList.contains("active") &&
                !container.contains(event.target)
            ) {
                container.classList.remove("active");
            }

        });


        /* ======================================================
           TOAST
        ====================================================== */

        function showToast(
            title,
            message,
            type = "success"
        ) {

            const toast =
                document.getElementById("toast");

            const toastTitle =
                document.getElementById("toastTitle");

            const toastMessage =
                document.getElementById("toastMessage");

            const toastIcon =
                document.getElementById("toastIcon");

            toastTitle.textContent = title;
            toastMessage.textContent = message;

            if (type === "error") {

                toastIcon.className =
                    "w-9 h-9 rounded-full bg-red-500/10 text-red-400 flex items-center justify-center shrink-0";

                toastIcon.innerHTML = `
                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M6 18L18 6M6 6l12 12"
                        ></path>
                    </svg>
                `;

            } else {

                toastIcon.className =
                    "w-9 h-9 rounded-full bg-cyan-500/10 text-cyan-400 flex items-center justify-center shrink-0";

                toastIcon.innerHTML = `
                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M5 13l4 4L19 7"
                        ></path>
                    </svg>
                `;
            }

            toast.classList.add("show");

            clearTimeout(toastTimer);

            toastTimer = setTimeout(() => {
                toast.classList.remove("show");
            }, 3500);
        }


        function showComingSoon(name) {

            showToast(
                "Coming Soon",
                `${name} will be available soon.`
            );
        }


        /* ======================================================
           TAB SWITCHING
        ====================================================== */

        function switchTab(tab) {

            const linksTabBtn =
                document.getElementById("tab-links");

            const folderTabBtn =
                document.getElementById("tab-folder");

            const linksView =
                document.getElementById("view-links");

            const folderView =
                document.getElementById("view-folder");


            if (tab === "links") {

                linksTabBtn.className =
                    "text-cyan-400 font-semibold border-b-2 border-cyan-400 px-1 pb-2 transition";

                folderTabBtn.className =
                    "text-gray-400 hover:text-gray-300 font-medium px-1 pb-2 transition";

                linksView.classList.remove("hidden");
                folderView.classList.add("hidden");

            } else {

                folderTabBtn.className =
                    "text-cyan-400 font-semibold border-b-2 border-cyan-400 px-1 pb-2 transition";

                linksTabBtn.className =
                    "text-gray-400 hover:text-gray-300 font-medium px-1 pb-2 transition";

                folderView.classList.remove("hidden");
                linksView.classList.add("hidden");

            }

        }


        /* ======================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* ======================================================
           FILE ROW
        ====================================================== */

        function createProcessingRow(index, fileName) {

            const row =
                document.createElement("div");

            row.className =
                "processing-row bg-[#0a0e17] border border-gray-700/50 rounded-lg p-4 flex flex-col md:flex-row md:items-center justify-between gap-3";

            row.dataset.index = index;


            row.innerHTML = `

                <div class="flex items-center gap-3 w-full md:w-auto min-w-0">

                    <svg
                        class="w-5 h-5 text-gray-500 shrink-0"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"
                        ></path>
                    </svg>

                    <span
                        data-file-name
                        class="text-sm text-gray-300 font-medium truncate max-w-[200px] md:max-w-xs"
                        title="${escapeHtml(fileName || "Fetching info...")}"
                    >
                        ${escapeHtml(fileName || "Fetching info...")}
                    </span>

                </div>


                <div
                    data-status
                    class="flex items-center gap-2 text-xs text-cyan-400 font-medium shrink-0"
                >

                    <div class="spinner"></div>

                    Processing

                </div>


                <div
                    data-result
                    class="hidden flex items-center gap-2 w-full md:w-auto"
                >

                    <input
                        data-result-input
                        type="text"
                        readonly
                        value=""
                        class="result-input bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-emerald-400 text-xs font-mono outline-none w-full md:w-48"
                    >

                    <button
                        type="button"
                        data-copy-button
                        class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-xs font-semibold transition shrink-0"
                    >
                        Copy
                    </button>

                </div>

            `;


            const copyButton =
                row.querySelector("[data-copy-button]");

            copyButton.addEventListener("click", () => {

                const input =
                    row.querySelector("[data-result-input]");

                copyLink(input, copyButton);

            });


            return row;
        }


        /* ======================================================
           UPDATE PROCESSING ROW
        ====================================================== */

        function completeProcessingRow(
            row,
            shortLink,
            fileName
        ) {

            const nameElement =
                row.querySelector("[data-file-name]");

            const statusElement =
                row.querySelector("[data-status]");

            const resultElement =
                row.querySelector("[data-result]");

            const input =
                row.querySelector("[data-result-input]");


            if (fileName) {

                nameElement.textContent = fileName;
                nameElement.title = fileName;

                nameElement.classList.remove("text-gray-300");
                nameElement.classList.add("text-white");

            }


            statusElement.classList.add("hidden");


            if (shortLink) {

                input.value = shortLink;

                resultElement.classList.remove("hidden");
                resultElement.classList.add("flex");

            }

        }


        /* ======================================================
           ERROR ROW
        ====================================================== */

        function failProcessingRow(
            row,
            message
        ) {

            const statusElement =
                row.querySelector("[data-status]");

            const nameElement =
                row.querySelector("[data-file-name]");


            statusElement.innerHTML = `

                <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M6 18L18 6M6 6l12 12"
                    ></path>
                </svg>

                Failed

            `;

            statusElement.classList.remove(
                "text-cyan-400"
            );

            statusElement.classList.add(
                "text-red-400"
            );


            if (message) {
                nameElement.title = message;
            }

        }


        /* ======================================================
           EXTRACT FILE NAME
        ====================================================== */

        function extractDriveFileName(url) {

            try {

                const match =
                    url.match(/\/d\/([^/]+)/);

                if (match) {
                    return "Google Drive File";
                }

            } catch {}

            return "Google Drive File";
        }


        /* ======================================================
           EXTRACT UPLOAD LINK
        ====================================================== */

        function extractShortLink(data) {

            const uploadData =
                data?.data || data || {};

            return (
                uploadData.short_link ||
                uploadData.short_url ||
                uploadData.url ||
                uploadData.download_url ||
                uploadData.file_url ||
                (
                    uploadData.short_id
                        ? `${window.location.origin}/file/${encodeURIComponent(uploadData.short_id)}`
                        : ""
                )
            );
        }


        /* ======================================================
           REAL API UPLOAD
        ====================================================== */

        async function uploadSingleFile(
            driveUrl,
            row
        ) {

            try {

                const response =
                    await fetch("/api/upload", {

                        method: "POST",

                        credentials: "include",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            drive_url: driveUrl
                        })

                    });


                let data = null;

                try {
                    data = await response.json();
                } catch {
                    data = null;
                }


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    window.location.href = "/";
                    return {
                        success: false,
                        auth: false
                    };

                }


                if (
                    !response.ok ||
                    !data ||
                    data.status !== "success"
                ) {

                    const errorMessage =
                        data?.message ||
                        data?.error ||
                        `Upload failed (${response.status})`;

                    failProcessingRow(
                        row,
                        errorMessage
                    );

                    return {
                        success: false,
                        message: errorMessage
                    };

                }


                const uploadData =
                    data.data || data;


                /*
                 * Worker returns the real filename here.
                 * Update the UI only when available.
                 */
                if (uploadData.file_name) {

                    const nameElement =
                        row.querySelector("[data-file-name]");

                    if (nameElement) {

                        nameElement.textContent =
                            uploadData.file_name;

                        nameElement.title =
                            uploadData.file_name;

                        nameElement.classList.remove(
                            "text-gray-300"
                        );

                        nameElement.classList.add(
                            "text-white"
                        );
                    }
                }


                const link =
                    extractShortLink(data);


                if (!link) {

                    failProcessingRow(
                        row,
                        "Upload succeeded but no S-Cloud link was returned."
                    );

                    return {
                        success: false,
                        message: "No link returned"
                    };

                }


                completeProcessingRow(
                    row,
                    link,
                    uploadData.file_name
                );


                return {
                    success: true,
                    link,
                    data: uploadData
                };


            } catch (error) {

                console.error(
                    "Upload error:",
                    error
                );

                failProcessingRow(
                    row,
                    error?.message || "Network error"
                );

                return {
                    success: false,
                    message: error?.message || "Network error"
                };

            }

        }


        /* ======================================================
           START UPLOAD
        ====================================================== */

        async function startUpload() {

            if (isUploading) {
                return;
            }


            const textLinks =
                document.getElementById("driveLinks")
                    .value
                    .trim();

            const folderLink =
                document.getElementById("folderLink")
                    .value
                    .trim();


            const links =
                textLinks
                    .split(/\r?\n/)
                    .map(link => link.trim())
                    .filter(Boolean);


            const hasFolder =
                folderLink.length > 0;


            /*
             * Current tab decides which input is used.
             */
            const linksView =
                document.getElementById("view-links");

            const usingLinks =
                !linksView.classList.contains("hidden");


            let uploadItems = [];


            if (usingLinks) {

                if (links.length === 0) {

                    showToast(
                        "Missing Link",
                        "Please enter at least one Google Drive link.",
                        "error"
                    );

                    return;
                }

                uploadItems = links;

            } else {

                if (!hasFolder) {

                    showToast(
                        "Missing Folder",
                        "Please enter a Google Drive folder link.",
                        "error"
                    );

                    return;
                }

                uploadItems = [folderLink];

            }


            isUploading = true;


            const btn =
                document.getElementById("uploadBtn");


            const processingArea =
                document.getElementById("processing-area");


            btn.disabled = true;

            btn.innerHTML = `

                <div class="spinner border-t-white"></div>

                <span>Uploading...</span>

            `;

            btn.classList.add(
                "opacity-80",
                "cursor-wait"
            );


            processingArea.innerHTML = "";
            processingArea.classList.remove("hidden");


            const rows = [];


            /*
             * Create all visible processing rows first.
             */
            uploadItems.forEach((url, index) => {

                const row =
                    createProcessingRow(
                        index,
                        extractDriveFileName(url)
                    );

                processingArea.appendChild(row);

                rows.push(row);

            });


            let successCount = 0;
            let failedCount = 0;


            /*
             * Sequential processing keeps the UI predictable
             * and avoids sending many upload jobs at once.
             */
            for (
                let index = 0;
                index < uploadItems.length;
                index++
            ) {

                const result =
                    await uploadSingleFile(
                        uploadItems[index],
                        rows[index]
                    );


                if (result.success) {
                    successCount++;
                } else {
                    failedCount++;
                }

            }


            isUploading = false;

            btn.disabled = false;

            btn.classList.remove(
                "opacity-80",
                "cursor-wait"
            );


            if (
                successCount > 0 &&
                failedCount === 0
            ) {

                btn.innerHTML = `

                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M5 13l4 4L19 7"
                        ></path>
                    </svg>

                    <span>Upload Complete</span>

                `;

                btn.classList.remove(
                    "from-blue-600",
                    "to-cyan-500"
                );

                btn.classList.add(
                    "from-emerald-600",
                    "to-teal-500"
                );


                showToast(
                    "Upload Complete",
                    successCount === 1
                        ? "Your file has been uploaded successfully."
                        : `${successCount} files uploaded successfully.`
                );

            } else if (successCount > 0) {

                btn.innerHTML = `

                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M5 13l4 4L19 7"
                        ></path>
                    </svg>

                    <span>Upload Finished</span>

                `;


                showToast(
                    "Upload Finished",
                    `${successCount} succeeded, ${failedCount} failed.`
                );

            } else {

                btn.innerHTML = `

                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
                        ></path>
                    </svg>

                    <span>Try Again</span>

                `;


                showToast(
                    "Upload Failed",
                    "No files were uploaded successfully.",
                    "error"
                );

            }

        }


        /* ======================================================
           COPY LINK
        ====================================================== */

        async function copyLink(
            input,
            button
        ) {

            if (!input || !input.value) {
                return;
            }


            const originalText =
                button.innerText;


            try {

                if (
                    navigator.clipboard &&
                    window.isSecureContext
                ) {

                    await navigator.clipboard.writeText(
                        input.value
                    );

                } else {

                    input.focus();
                    input.select();

                    document.execCommand("copy");
                }


                button.innerText = "Copied!";

                button.classList.add(
                    "bg-emerald-600"
                );


                setTimeout(() => {

                    button.innerText =
                        originalText;

                    button.classList.remove(
                        "bg-emerald-600"
                    );

                }, 1500);


                showToast(
                    "Copied",
                    "S-Cloud link copied to clipboard."
                );


            } catch (error) {

                console.error(
                    "Copy failed:",
                    error
                );

                showToast(
                    "Copy Failed",
                    "Please copy the link manually.",
                    "error"
                );

            }

        }


        /* ======================================================
           LOAD USER
        ====================================================== */

        async function loadUser() {

            try {

                const response =
                    await fetch("/api/me", {
                        method: "GET",
                        credentials: "include"
                    });


                if (!response.ok) {

                    window.location.href = "/";
                    return;

                }


                const data =
                    await response.json();


                if (
                    !data ||
                    data.status !== "success"
                ) {

                    window.location.href = "/";
                    return;

                }


                const user =
                    data.data || data.user || data;


                const name =
                    user.name ||
                    user.full_name ||
                    user.username ||
                    "S-Cloud User";


                const email =
                    user.email ||
                    "";


                document.getElementById(
                    "profileName"
                ).textContent = name;


                document.getElementById(
                    "profileEmail"
                ).textContent = email;


                document.getElementById(
                    "dropdownProfileName"
                ).textContent = name;


                document.getElementById(
                    "dropdownProfileEmail"
                ).textContent = email;


            } catch (error) {

                console.error(
                    "loadUser error:",
                    error
                );

                window.location.href = "/";

            }

        }


        /* ======================================================
           LOGOUT
        ====================================================== */

        async function logout() {

            try {

                await fetch(
                    "/api/logout",
                    {
                        method: "POST",
                        credentials: "include"
                    }
                );

            } catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

            }


            window.location.href = "/";

        }


        /* ======================================================
           KEYBOARD SHORTCUT
        ====================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    const container =
                        document.querySelector(
                            ".profile-dropdown-container"
                        );

                    if (container) {
                        container.classList.remove(
                            "active"
                        );
                    }

                    closeSidebar();

                }

            }
        );


        /* ======================================================
           INITIALIZE
        ====================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                loadUser();

            }
        );

    </script>
