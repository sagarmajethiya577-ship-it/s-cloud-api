<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0b0f19;
        }


        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            background-image:
                radial-gradient(
                    circle at 15% 0%,
                    rgba(59,130,246,.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 8%,
                    rgba(139,92,246,.10),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(6,182,212,.055),
                    transparent 32%
                );

            z-index: -1;
            pointer-events: none;
        }


        .glass-card {
            background: rgba(24,31,45,.68);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border: 1px solid rgba(148,163,184,.085);

            box-shadow:
                0 16px 45px -24px rgba(0,0,0,.75);

            border-radius: 1.25rem;
        }


        nav.glass-card {
            border-radius: 0;
            border-top: 0;
            border-left: 0;
            border-right: 0;
        }


        #sidebar {
            background: rgba(17,24,39,.84);

            border-right:
                1px solid rgba(148,163,184,.09);

            box-shadow:
                18px 0 50px -35px rgba(0,0,0,.9);

            transition:
                transform .3s ease-in-out;
        }


        .sidebar-open {
            transform: translateX(0);
        }


        .sidebar-closed {
            transform: translateX(-100%);
        }


        .dropdown-menu {
            display: none;
            opacity: 0;

            transition:
                opacity .2s ease-in-out;
        }


        .profile-dropdown-container.active
        .dropdown-menu {
            display: block;
            opacity: 1;
        }


        .spinner {
            width: 16px;
            height: 16px;

            border:
                2px solid rgba(255,255,255,.2);

            border-top-color:
                #22d3ee;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }


        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        textarea::-webkit-scrollbar {
            width: 6px;
        }


        textarea::-webkit-scrollbar-track {
            background: transparent;
        }


        textarea::-webkit-scrollbar-thumb {
            background:
                rgba(148,163,184,.2);

            border-radius: 10px;
        }


        .upload-row {
            background: #0a0e17;

            border:
                1px solid rgba(148,163,184,.14);

            transition:
                border-color .2s ease,
                background .2s ease;
        }


        .upload-row:hover {
            border-color:
                rgba(34,211,238,.18);

            background:
                rgba(10,14,23,.92);
        }


        .result-input {
            background: rgba(31,41,55,.8);

            border:
                1px solid rgba(75,85,99,.9);
        }


        .result-input:focus {
            border-color:
                rgba(34,211,238,.4);
        }


        .success-ring {
            animation:
                successPop .25s ease-out;
        }


        @keyframes successPop {
            from {
                transform: scale(.8);
                opacity: .4;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }


        @media (min-width: 1024px) {

            #sidebar {
                transform: translateX(0);
            }

        }

    </style>
</head>

    <script>


        /* =========================================================
           GLOBAL STATE
        ========================================================== */

        let activeTab = "links";

        let uploadRunning = false;

        let toastTimer = null;


        /* =========================================================
           HELPERS
        ========================================================== */

        function $(id) {
            return document.getElementById(id);
        }


        function escapeHtml(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function escapeAttribute(value) {
            return escapeHtml(value);
        }


        function showToast(
            title,
            message,
            type = "success"
        ) {

            const toast = $("toast");
            const titleEl = $("toastTitle");
            const messageEl = $("toastMessage");
            const icon = $("toastIcon");

            if (!toast) return;

            titleEl.textContent = title || "Notice";
            messageEl.textContent = message || "";

            if (type === "error") {

                icon.className =
                    "w-9 h-9 rounded-xl bg-red-500/10 text-red-400 flex items-center justify-center shrink-0";

                icon.innerHTML = `
                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M6 18L18 6M6 6l12 12"
                        ></path>
                    </svg>
                `;

            } else {

                icon.className =
                    "w-9 h-9 rounded-xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center shrink-0";

                icon.innerHTML = `
                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M5 13l4 4L19 7"
                        ></path>
                    </svg>
                `;

            }

            toast.classList.remove("hidden");

            clearTimeout(toastTimer);

            toastTimer = setTimeout(() => {
                toast.classList.add("hidden");
            }, 3500);

        }


        function showComingSoon(name) {

            showToast(
                name || "Feature",
                "This feature is coming soon.",
                "success"
            );

        }


        /* =========================================================
           PROFILE DROPDOWN
        ========================================================== */

        function toggleDropdown(event) {

            event.stopPropagation();

            const container =
                document.querySelector(
                    ".profile-dropdown-container"
                );

            if (!container) return;

            container.classList.toggle("active");

        }


        document.addEventListener("click", function(event) {

            const container =
                document.querySelector(
                    ".profile-dropdown-container"
                );

            if (
                container &&
                container.classList.contains("active") &&
                !container.contains(event.target)
            ) {

                container.classList.remove("active");

            }

        });


        /* =========================================================
           SIDEBAR
        ========================================================== */

        function toggleSidebar() {

            const sidebar = $("sidebar");
            const overlay = $("sidebar-overlay");

            if (!sidebar || !overlay) return;


            if (
                window.matchMedia(
                    "(min-width: 1024px)"
                ).matches
            ) {
                return;
            }


            if (
                sidebar.classList.contains(
                    "sidebar-closed"
                )
            ) {

                sidebar.classList.remove(
                    "sidebar-closed"
                );

                sidebar.classList.add(
                    "sidebar-open"
                );

                overlay.classList.remove("hidden");

            } else {

                sidebar.classList.remove(
                    "sidebar-open"
                );

                sidebar.classList.add(
                    "sidebar-closed"
                );

                overlay.classList.add("hidden");

            }

        }


        document.querySelectorAll(
            "#sidebar a"
        ).forEach(function(link) {

            link.addEventListener(
                "click",
                function() {

                    if (
                        window.matchMedia(
                            "(max-width: 1023px)"
                        ).matches
                    ) {

                        const sidebar = $("sidebar");
                        const overlay = $("sidebar-overlay");

                        sidebar.classList.remove(
                            "sidebar-open"
                        );

                        sidebar.classList.add(
                            "sidebar-closed"
                        );

                        overlay.classList.add(
                            "hidden"
                        );

                    }

                }
            );

        });


        /* =========================================================
           TAB SWITCHING
        ========================================================== */

        function switchTab(tab) {

            activeTab = tab;

            const linksTabBtn =
                $("tab-links");

            const folderTabBtn =
                $("tab-folder");

            const linksView =
                $("view-links");

            const folderView =
                $("view-folder");


            if (tab === "links") {

                linksTabBtn.className =
                    "text-cyan-400 font-semibold border-b-2 border-cyan-400 px-1 pb-2 transition";

                folderTabBtn.className =
                    "text-gray-400 hover:text-gray-300 font-medium px-1 pb-2 transition";

                linksView.classList.remove(
                    "hidden"
                );

                folderView.classList.add(
                    "hidden"
                );

            } else {

                folderTabBtn.className =
                    "text-cyan-400 font-semibold border-b-2 border-cyan-400 px-1 pb-2 transition";

                linksTabBtn.className =
                    "text-gray-400 hover:text-gray-300 font-medium px-1 pb-2 transition";

                folderView.classList.remove(
                    "hidden"
                );

                linksView.classList.add(
                    "hidden"
                );

            }

        }


        /* =========================================================
           CURRENT USER
        ========================================================== */

        async function loadUser() {

            try {

                const response =
                    await fetch(
                        "/api/me",
                        {
                            method: "GET",
                            credentials: "include"
                        }
                    );


                if (!response.ok) {

                    window.location.href = "/";

                    return;

                }


                const data =
                    await response.json();


                const user =
                    data.user ||
                    data.data ||
                    data;


                const name =
                    user.name ||
                    user.full_name ||
                    user.username ||
                    user.email ||
                    "Publisher";


                const email =
                    user.email ||
                    "-";


                const profileName =
                    $("profileName");

                const dropdownName =
                    $("dropdownUserName");

                const dropdownEmail =
                    $("dropdownUserEmail");


                if (profileName) {
                    profileName.textContent =
                        name;
                }


                if (dropdownName) {
                    dropdownName.textContent =
                        name;
                }


                if (dropdownEmail) {
                    dropdownEmail.textContent =
                        email;
                }

            } catch (error) {

                console.error(
                    "Failed to load user:",
                    error
                );

            }

        }


        /* =========================================================
           LOGOUT
        ========================================================== */

        async function logout() {

            try {

                await fetch(
                    "/api/logout",
                    {
                        method: "POST",
                        credentials: "include"
                    }
                );

            } catch (error) {

                // Redirect anyway.

            }


            window.location.href = "/";

        }


        /* =========================================================
           GOOGLE DRIVE VALIDATION
        ========================================================== */

        function isDriveFileUrl(url) {

            return (
                /drive\.google\.com\/file\/d\//i.test(url) ||
                /drive\.google\.com\/open\?id=/i.test(url) ||
                /drive\.usercontent\.google\.com/i.test(url)
            );

        }


        function isDriveFolderUrl(url) {

            return (
                /drive\.google\.com\/drive\/folders\//i.test(url)
            );

        }


        function extractDriveFileName(url) {

            try {

                const match =
                    String(url).match(
                        /\/d\/([^/]+)/i
                    );

                if (match) {
                    return "Google Drive File";
                }

            } catch (error) {}

            return "Google Drive File";

        }


        /* =========================================================
           CREATE PROCESSING ROW
        ========================================================== */

        function createProcessingRow(
            index,
            fileName
        ) {

            const row =
                document.createElement("div");

            row.id =
                `upload-row-${index}`;

            row.className =
                "upload-row rounded-lg p-4 flex flex-col md:flex-row md:items-center justify-between gap-3";


            row.innerHTML = `

                <div
                    class="flex items-center gap-3 w-full md:w-auto min-w-0"
                >

                    <svg
                        class="w-5 h-5 text-gray-500 shrink-0"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"
                        ></path>
                    </svg>

                    <span
                        data-file-name
                        class="text-sm text-gray-300 font-medium truncate max-w-[220px] md:max-w-xs"
                        title="${escapeAttribute(fileName)}"
                    >
                        ${escapeHtml(fileName)}
                    </span>

                </div>


                <div
                    data-status
                    class="flex items-center gap-2 text-xs text-cyan-400 font-medium shrink-0"
                >

                    <div class="spinner"></div>

                    <span>Processing</span>

                </div>


                <div
                    data-result
                    class="hidden items-center gap-2 w-full md:w-auto"
                >

                    <input
                        data-result-input
                        type="text"
                        readonly
                        value=""
                        class="result-input rounded px-3 py-1.5 text-emerald-400 text-xs font-mono outline-none w-full md:w-48"
                    >

                    <button
                        type="button"
                        onclick="copyLink(this)"
                        class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-xs font-semibold transition shrink-0"
                    >
                        Copy
                    </button>

                </div>

            `;


            $("processing-area")
                .appendChild(row);


            return row;

        }


        /* =========================================================
           UPDATE PROCESSING ROW
        ========================================================== */

        function setRowProcessing(
            row,
            message = "Processing"
        ) {

            const status =
                row.querySelector(
                    "[data-status]"
                );

            const result =
                row.querySelector(
                    "[data-result]"
                );


            if (status) {

                status.className =
                    "flex items-center gap-2 text-xs text-cyan-400 font-medium shrink-0";

                status.innerHTML = `
                    <div class="spinner"></div>
                    <span>${escapeHtml(message)}</span>
                `;

                status.classList.remove(
                    "hidden"
                );

            }


            if (result) {

                result.classList.add(
                    "hidden"
                );

                result.classList.remove(
                    "flex"
                );

            }

        }


        function setRowSuccess(
            row,
            link
        ) {

            const status =
                row.querySelector(
                    "[data-status]"
                );

            const result =
                row.querySelector(
                    "[data-result]"
                );

            const input =
                row.querySelector(
                    "[data-result-input]"
                );


            if (status) {

                status.className =
                    "flex items-center gap-2 text-xs text-emerald-400 font-medium shrink-0 success-ring";

                status.innerHTML = `
                    <svg
                        class="w-4 h-4"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M5 13l4 4L19 7"
                        ></path>
                    </svg>

                    <span>Completed</span>
                `;

            }


            if (input) {

                input.value =
                    link || "";

            }


            if (result) {

                result.classList.remove(
                    "hidden"
                );

                result.classList.add(
                    "flex"
                );

            }

        }


        function setRowError(
            row,
            message
        ) {

            const status =
                row.querySelector(
                    "[data-status]"
                );


            if (status) {

                status.className =
                    "flex items-center gap-2 text-xs text-red-400 font-medium shrink-0";

                status.innerHTML = `
                    <svg
                        class="w-4 h-4"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M6 18L18 6M6 6l12 12"
                        ></path>
                    </svg>

                    <span>${escapeHtml(
                        message || "Upload failed"
                    )}</span>
                `;

            }

        }


        /* =========================================================
           API UPLOAD
        ========================================================== */

        async function uploadDriveUrl(
            url,
            row
        ) {

            setRowProcessing(
                row,
                "Processing"
            );


            const initialName =
                extractDriveFileName(url);


            try {

                const response =
                    await fetch(
                        "/api/upload",
                        {
                            method: "POST",
                            credentials: "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                drive_url: url
                            })
                        }
                    );


                if (
                    response.status === 401
                ) {

                    window.location.href =
                        "/";

                    return {
                        success: false,
                        unauthorized: true
                    };

                }


                let data = null;


                try {

                    data =
                        await response.json();

                } catch (error) {

                    throw new Error(
                        "Invalid server response."
                    );

                }


                if (!response.ok) {

                    throw new Error(
                        data?.message ||
                        "Upload failed."
                    );

                }


                if (
                    data.status !==
                    "success"
                ) {

                    throw new Error(
                        data?.message ||
                        "Upload failed."
                    );

                }


                const uploadData =
                    data.data ||
                    data;


                /* ===============================================
                   REAL FILE NAME FROM API
                ================================================ */

                if (
                    uploadData.file_name
                ) {

                    const nameElement =
                        row.querySelector(
                            "[data-file-name]"
                        );


                    if (nameElement) {

                        nameElement.textContent =
                            uploadData.file_name;

                        nameElement.title =
                            uploadData.file_name;

                        nameElement.classList.remove(
                            "text-gray-300"
                        );

                        nameElement.classList.add(
                            "text-white"
                        );

                    }

                }


                /* ===============================================
                   REAL SHORT LINK
                ================================================ */

                const link =
                    uploadData.short_link ||
                    uploadData.short_url ||
                    uploadData.url ||
                    uploadData.download_url ||
                    uploadData.file_url ||
                    (
                        uploadData.short_id
                            ? `${window.location.origin}/file/${encodeURIComponent(uploadData.short_id)}`
                            : ""
                    );


                if (!link) {

                    throw new Error(
                        "Upload succeeded but no S-Cloud link was returned."
                    );

                }


                setRowSuccess(
                    row,
                    link
                );


                return {
                    success: true,
                    data: uploadData,
                    link: link
                };


            } catch (error) {

                console.error(
                    "Upload error:",
                    error
                );


                setRowError(
                    row,
                    error?.message ||
                    "Upload failed."
                );


                return {
                    success: false,
                    error: error
                };

            }

        }


        /* =========================================================
           START UPLOAD
        ========================================================== */

        async function startUpload() {

            if (uploadRunning) {
                return;
            }


            let urls = [];


            /* =====================================================
               LINKS TAB
            ====================================================== */

            if (activeTab === "links") {

                const text =
                    $("driveLinks").value.trim();


                if (!text) {

                    showToast(
                        "Link Required",
                        "Please enter at least one Google Drive link.",
                        "error"
                    );

                    return;

                }


                urls =
                    text
                        .split(/\r?\n/)
                        .map(
                            item =>
                                item.trim()
                        )
                        .filter(Boolean);


                if (!urls.length) {

                    showToast(
                        "Link Required",
                        "Please enter a valid Google Drive link.",
                        "error"
                    );

                    return;

                }


                for (
                    const url of urls
                ) {

                    if (
                        !isDriveFileUrl(url) &&
                        !isDriveFolderUrl(url)
                    ) {

                        showToast(
                            "Invalid Link",
                            "One or more links are not valid Google Drive links.",
                            "error"
                        );

                        return;

                    }

                }

            }


            /* =====================================================
               FOLDER TAB
            ====================================================== */

            else {

                const folder =
                    $("folderLink").value.trim();


                if (!folder) {

                    showToast(
                        "Folder Required",
                        "Please enter a Google Drive folder link.",
                        "error"
                    );

                    return;

                }


                if (
                    !isDriveFolderUrl(folder)
                ) {

                    showToast(
                        "Invalid Folder",
                        "Please enter a valid Google Drive folder link.",
                        "error"
                    );

                    return;

                }


                urls = [folder];

            }


            uploadRunning = true;


            const button =
                $("uploadBtn");


            const processing =
                $("processing-area");


            button.disabled = true;

            button.classList.add(
                "opacity-80",
                "cursor-wait"
            );


            button.innerHTML = `
                <div
                    class="spinner"
                    style="border-top-color:white"
                ></div>

                <span>Uploading...</span>
            `;


            processing.innerHTML = "";

            processing.classList.remove(
                "hidden"
            );


            /* =====================================================
               CREATE ALL ROWS
            ====================================================== */

            const rows = [];


            urls.forEach(
                function(url, index) {

                    const row =
                        createProcessingRow(
                            index + 1,
                            activeTab === "folder"
                                ? "Google Drive Folder"
                                : extractDriveFileName(url)
                        );


                    rows.push({
                        url: url,
                        row: row
                    });

                }
            );


            /* =====================================================
               PROCESS SEQUENTIALLY
            ====================================================== */

            let successCount = 0;


            for (
                const item of rows
            ) {

                const result =
                    await uploadDriveUrl(
                        item.url,
                        item.row
                    );


                if (
                    result.success
                ) {

                    successCount++;

                }


                if (
                    result.unauthorized
                ) {

                    return;

                }

            }


            /* =====================================================
               FINISH
            ====================================================== */

            uploadRunning = false;


            button.disabled = false;

            button.classList.remove(
                "opacity-80",
                "cursor-wait"
            );


            if (
                successCount ===
                rows.length
            ) {

                button.innerHTML = `
                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M5 13l4 4L19 7"
                        ></path>
                    </svg>

                    <span>Upload Complete</span>
                `;


                button.classList.remove(
                    "from-blue-600",
                    "to-cyan-500"
                );

                button.classList.add(
                    "from-emerald-600",
                    "to-teal-500"
                );


                showToast(
                    "Upload Complete",
                    `${successCount} file${successCount === 1 ? "" : "s"} uploaded successfully.`
                );


            } else if (
                successCount > 0
            ) {

                button.innerHTML = `
                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M5 13l4 4L19 7"
                        ></path>
                    </svg>

                    <span>Upload Finished</span>
                `;


                showToast(
                    "Upload Finished",
                    `${successCount} of ${rows.length} upload${rows.length === 1 ? "" : "s"} completed.`
                );

            } else {

                button.innerHTML = `
                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
                        ></path>
                    </svg>

                    <span>Try Again</span>
                `;


                showToast(
                    "Upload Failed",
                    "No file was uploaded successfully.",
                    "error"
                );

            }


            /* =====================================================
               RESET BUTTON AFTER SHORT DELAY
            ====================================================== */

            setTimeout(
                function() {

                    button.classList.remove(
                        "from-emerald-600",
                        "to-teal-500"
                    );


                    button.classList.add(
                        "from-blue-600",
                        "to-cyan-500"
                    );


                    button.innerHTML = `
                        <svg
                            class="w-5 h-5 group-hover:-translate-y-1 transition-transform"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
                            ></path>
                        </svg>

                        <span>Upload</span>
                    `;

                },
                2200
            );

        }


        /* =========================================================
           COPY LINK
        ========================================================== */

        async function copyLink(
            button
        ) {

            const input =
                button
                    .parentElement
                    .querySelector(
                        "[data-result-input]"
                    );


            if (!input) {
                return;
            }


            const text =
                input.value;


            if (!text) {
                return;
            }


            try {

                if (
                    navigator.clipboard &&
                    window.isSecureContext
                ) {

                    await navigator.clipboard.writeText(
                        text
                    );

                } else {

                    input.select();

                    input.setSelectionRange(
                        0,
                        99999
                    );

                    document.execCommand(
                        "copy"
                    );

                }


                const originalText =
                    button.innerText;


                button.innerText =
                    "Copied!";


                button.classList.add(
                    "bg-emerald-600"
                );


                setTimeout(
                    function() {

                        button.innerText =
                            originalText;

                        button.classList.remove(
                            "bg-emerald-600"
                        );

                    },
                    1500
                );


            } catch (error) {

                showToast(
                    "Copy Failed",
                    "Unable to copy the link.",
                    "error"
                );

            }

        }


        /* =========================================================
           ENTER KEY / SHORTCUT
        ========================================================== */

        $("driveLinks")?.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.ctrlKey &&
                    event.key === "Enter"
                ) {

                    startUpload();

                }

            }
        );


        $("folderLink")?.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    startUpload();

                }

            }
        );


        /* =========================================================
           INITIALIZE
        ========================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                loadUser();

            }
        );

    </script>
