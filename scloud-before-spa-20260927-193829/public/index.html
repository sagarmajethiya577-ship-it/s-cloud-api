<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>S-Cloud | Publisher Network</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0b0f19;
        }

        /* =========================
           BACKGROUND (Matched with other pages)
        ========================== */

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: -1;
            background-image:
                radial-gradient(
                    circle at 15% 0%,
                    rgba(59, 130, 246, .13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 8%,
                    rgba(139, 92, 246, .10),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(6, 182, 212, .055),
                    transparent 32%
                );
        }

        /* =========================
           MAIN GLASS PANEL
        ========================== */

        .glass-panel {
            background: rgba(17, 24, 39, 0.72);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            border: 1px solid rgba(148, 163, 184, 0.10);

            box-shadow:
                0 25px 70px -25px rgba(0, 0, 0, 0.85),
                inset 0 1px 0 rgba(255, 255, 255, 0.025);

            border-radius: 24px;
        }

        /* =========================
           INPUTS
        ========================== */

        .input-field {
            width: 100%;

            background: rgba(12, 18, 29, 0.72);

            border: 1px solid rgba(148, 163, 184, 0.12);

            color: white;

            border-radius: 12px;

            padding: 13px 16px;

            font-size: 13px;

            outline: none;

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .input-field::placeholder {
            color: rgba(148, 163, 184, 0.55);
        }

        .input-field:focus {
            border-color: rgba(34, 211, 238, 0.65);

            background: rgba(12, 18, 29, 0.9);

            box-shadow:
                0 0 0 3px rgba(34, 211, 238, 0.08);
        }

        /* =========================
           BUTTONS
        ========================== */

        .primary-btn {
            width: 100%;

            border-radius: 12px;

            padding: 13px 16px;

            font-size: 13px;

            font-weight: 600;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #0891b2
                );

            box-shadow:
                0 8px 25px rgba(8, 145, 178, 0.20);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                filter .2s ease;
        }

        .primary-btn:hover {
            transform: translateY(-1px);

            filter: brightness(1.08);

            box-shadow:
                0 10px 30px rgba(8, 145, 178, 0.32);
        }

        .primary-btn:active {
            transform: translateY(0);
        }

        .register-btn {
            background:
                linear-gradient(
                    135deg,
                    #059669,
                    #0d9488
                );

            box-shadow:
                0 8px 25px rgba(16, 185, 129, 0.18);
        }

        .register-btn:hover {
            box-shadow:
                0 10px 30px rgba(16, 185, 129, 0.30);
        }

        /* =========================
           GOOGLE BUTTON
        ========================== */

        .google-btn {
            width: 100%;

            border-radius: 12px;

            padding: 12px 16px;

            background: rgba(255, 255, 255, 0.96);

            color: #1f2937;

            font-size: 13px;

            font-weight: 600;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            transition:
                transform .2s ease,
                background .2s ease;
        }

        .google-btn:hover {
            background: white;
            transform: translateY(-1px);
        }

        /* =========================
           FORM ANIMATION
        ========================== */

        .fade-in {
            animation: fadeIn .28s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           TOAST
        ========================== */

        #toast {
            position: fixed;

            left: 50%;
            bottom: 24px;

            transform:
                translate(-50%, 20px);

            opacity: 0;

            pointer-events: none;

            z-index: 100;

            width: calc(100% - 32px);
            max-width: 390px;

            padding: 13px 16px;

            border-radius: 13px;

            background: rgba(17, 24, 39, 0.94);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(148, 163, 184, 0.14);

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.5);

            transition:
                opacity .25s ease,
                transform .25s ease;
        }

        #toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }

        #toast.success {
            border-color: rgba(16, 185, 129, 0.35);
        }

        #toast.error {
            border-color: rgba(239, 68, 68, 0.35);
        }

        /* =========================
           LOADING SPINNER
        ========================== */

        .spinner {
            width: 16px;
            height: 16px;

            border: 2px solid rgba(255, 255, 255, 0.30);
            border-top-color: white;

            border-radius: 50%;

            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 480px) {

            .glass-panel {
                border-radius: 20px;

                padding: 24px !important;
            }

            .logo-title {
                font-size: 29px !important;
            }

            .logo-icon {
                width: 34px !important;
                height: 34px !important;
            }
        }
    </style>
</head>


<body
    class="min-h-screen flex items-center justify-center px-4 py-6 text-white"
>

    <!-- =========================
         MAIN CONTAINER
    ========================== -->

    <main
        class="glass-panel w-full max-w-[410px] p-7 sm:p-8 relative z-10"
    >

        <!-- =========================
             LOGO / HEADER
        ========================== -->

        <div class="text-center mb-7">

            <div
                class="flex items-center justify-center gap-2"
            >

                <!-- Cloud Logo -->
                <svg
                    class="logo-icon w-9 h-9 text-cyan-400 drop-shadow-[0_0_8px_rgba(34,211,238,0.65)]"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999
                        5.002 5.002 0 10-9.78 2.096
                        A4.001 4.001 0 003 15z"
                    />
                </svg>

                <h1
                    class="logo-title text-[30px] font-extrabold tracking-[0.14em]
                    text-transparent bg-clip-text
                    bg-gradient-to-r from-cyan-400 to-blue-500
                    drop-shadow-lg"
                >
                    S-CLOUD
                </h1>

            </div>

            <p
                class="text-[11px] text-cyan-100/55
                font-medium tracking-[0.18em]
                uppercase mt-2"
            >
                Upload & Earn Money
            </p>

        </div>


        <!-- =========================
             GOOGLE BUTTON
        ========================== -->

        <button
            type="button"
            onclick="showToast('Google login is coming soon.', 'error')"
            class="google-btn"
        >

            <svg
                class="w-5 h-5"
                viewBox="0 0 24 24"
            >
                <path
                    fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92
                    c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57
                    c2.08-1.92 3.28-4.74 3.28-8.09z"
                />

                <path
                    fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77
                    c-.98.66-2.23 1.06-3.71 1.06
                    -2.86 0-5.29-1.93-6.16-4.53H2.18v2.84
                    C3.99 20.53 7.7 23 12 23z"
                />

                <path
                    fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09
                    s.13-1.43.35-2.09V7.07H2.18
                    C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93
                    l2.85-2.22.81-.62z"
                />

                <path
                    fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15
                    C17.45 2.09 14.97 1 12 1
                    7.7 1 3.99 3.47 2.18 7.07
                    l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                />
            </svg>

            Continue with Google

        </button>


        <!-- =========================
             DIVIDER
        ========================== -->

        <div class="flex items-center my-5">

            <div
                class="flex-1 border-t border-gray-700/50"
            ></div>

            <span
                class="px-3 text-[10px]
                text-gray-500
                tracking-[0.14em]
                uppercase font-semibold"
            >
                Or use email
            </span>

            <div
                class="flex-1 border-t border-gray-700/50"
            ></div>

        </div>


        <!-- =========================
             LOGIN FORM
        ========================== -->

        <form
            id="login-form"
            class="space-y-4 fade-in"
        >

            <div>

                <input
                    id="login-email"
                    type="email"
                    autocomplete="email"
                    placeholder="Email Address"
                    class="input-field"
                    required
                >

            </div>


            <div>

                <input
                    id="login-password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Password"
                    class="input-field"
                    required
                >

            </div>


            <div class="flex justify-end">

                <button
                    type="button"
                    onclick="showToast('Forgot password is coming soon.', 'error')"
                    class="text-[11px] text-cyan-400
                    hover:text-cyan-300 transition"
                >
                    Forgot Password?
                </button>

            </div>


            <button
                id="login-btn"
                type="submit"
                class="primary-btn"
            >
                <span id="login-btn-text">
                    Secure Login
                </span>
            </button>


            <p
                class="text-center text-[12px]
                text-gray-500 pt-2"
            >
                New to S-Cloud?

                <button
                    type="button"
                    onclick="toggleForms()"
                    class="text-cyan-400
                    hover:text-cyan-300
                    font-semibold
                    ml-1
                    transition"
                >
                    Create Account
                </button>

            </p>

        </form>


        <!-- =========================
             REGISTER FORM
        ========================== -->

        <form
            id="register-form"
            class="space-y-4 hidden fade-in"
        >

            <div>

                <input
                    id="register-name"
                    type="text"
                    autocomplete="name"
                    placeholder="Choose a Username"
                    class="input-field"
                    required
                >

            </div>


            <div>

                <input
                    id="register-email"
                    type="email"
                    autocomplete="email"
                    placeholder="Email Address"
                    class="input-field"
                    required
                >

            </div>


            <div>

                <input
                    id="register-password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Create Password"
                    minlength="6"
                    class="input-field"
                    required
                >

            </div>


            <button
                id="register-btn"
                type="submit"
                class="primary-btn register-btn"
            >
                <span id="register-btn-text">
                    Start Earning Now
                </span>
            </button>


            <p
                class="text-center text-[12px]
                text-gray-500 pt-2"
            >
                Already registered?

                <button
                    type="button"
                    onclick="toggleForms()"
                    class="text-emerald-400
                    hover:text-emerald-300
                    font-semibold
                    ml-1
                    transition"
                >
                    Sign In here
                </button>

            </p>

        </form>


        <!-- =========================
             FOOTER
        ========================== -->

        <div
            class="mt-7 pt-4
            border-t border-gray-700/30
            text-center"
        >

            <p
                class="text-[9px]
                text-gray-600
                tracking-[0.12em]
                uppercase"
            >
                Secure Publisher Network
            </p>

        </div>

    </main>


    <!-- =========================
         TOAST
    ========================== -->

    <div id="toast">

        <div class="flex items-start gap-3">

            <div
                id="toast-icon"
                class="mt-0.5 text-sm"
            >
                ✓
            </div>

            <div
                id="toast-message"
                class="text-[12px] text-gray-200 leading-5"
            ></div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* =========================================
           ELEMENTS
        ========================================== */

        const loginForm =
            document.getElementById("login-form");

        const registerForm =
            document.getElementById("register-form");

        const loginBtn =
            document.getElementById("login-btn");

        const registerBtn =
            document.getElementById("register-btn");


        /* =========================================
           TOGGLE LOGIN / REGISTER
        ========================================== */

        function toggleForms() {

            if (loginForm.classList.contains("hidden")) {

                registerForm.classList.add("hidden");

                loginForm.classList.remove("hidden");

                const email =
                    document.getElementById("register-email").value;

                if (email) {
                    document.getElementById("login-email").value = email;
                }

                setTimeout(() => {
                    document
                        .getElementById("login-email")
                        .focus();
                }, 100);

            } else {

                loginForm.classList.add("hidden");

                registerForm.classList.remove("hidden");

                setTimeout(() => {
                    document
                        .getElementById("register-name")
                        .focus();
                }, 100);
            }
        }


        /* =========================================
           TOAST
        ========================================== */

        let toastTimer = null;

        function showToast(message, type = "success") {

            const toast =
                document.getElementById("toast");

            const toastMessage =
                document.getElementById("toast-message");

            const toastIcon =
                document.getElementById("toast-icon");

            clearTimeout(toastTimer);

            toast.classList.remove(
                "success",
                "error"
            );

            toast.classList.add(type);

            toastMessage.textContent = message;

            if (type === "success") {

                toastIcon.textContent = "✓";
                toastIcon.className =
                    "mt-0.5 text-sm text-emerald-400";

            } else {

                toastIcon.textContent = "!";
                toastIcon.className =
                    "mt-0.5 text-sm text-red-400";
            }

            toast.classList.add("show");

            toastTimer = setTimeout(() => {

                toast.classList.remove("show");

            }, 3500);
        }


        /* =========================================
           BUTTON LOADING
        ========================================== */

        function setButtonLoading(button, loading, text) {

            if (loading) {

                button.disabled = true;

                button.innerHTML = `
                    <span class="flex items-center justify-center gap-2">
                        <span class="spinner"></span>
                        <span>${text}</span>
                    </span>
                `;

                button.style.opacity = "0.75";

            } else {

                button.disabled = false;

                button.innerHTML = `
                    <span>${text}</span>
                `;

                button.style.opacity = "1";
            }
        }


        /* =========================================
           LOGIN
        ========================================== */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document
                        .getElementById("login-email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("login-password")
                        .value;

                if (!email || !password) {

                    showToast(
                        "Please enter email and password.",
                        "error"
                    );

                    return;
                }

                setButtonLoading(
                    loginBtn,
                    true,
                    "Signing In..."
                );

                try {

                    const response =
                        await fetch(
                            "/api/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                credentials: "same-origin",

                                body: JSON.stringify({
                                    email,
                                    password
                                })
                            }
                        );

                    let data = {};

                    try {
                        data = await response.json();
                    } catch (_) {
                        data = {};
                    }


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Invalid email or password."
                        );
                    }


                    if (
                        data.status &&
                        data.status !== "success"
                    ) {

                        throw new Error(
                            data.message ||
                            "Login failed."
                        );
                    }


                    showToast(
                        "Login successful. Opening dashboard...",
                        "success"
                    );


                    setTimeout(() => {

                        window.location.href =
                            "/dashboard";

                    }, 500);

                } catch (error) {

                    showToast(
                        error.message ||
                        "Unable to login. Please try again.",
                        "error"
                    );

                    setButtonLoading(
                        loginBtn,
                        false,
                        "Secure Login"
                    );
                }

            }
        );


        /* =========================================
           REGISTER
        ========================================== */

        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const name =
                    document
                        .getElementById("register-name")
                        .value
                        .trim();

                const email =
                    document
                        .getElementById("register-email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("register-password")
                        .value;


                if (!name || !email || !password) {

                    showToast(
                        "Please fill all fields.",
                        "error"
                    );

                    return;
                }


                if (password.length < 6) {

                    showToast(
                        "Password must be at least 6 characters.",
                        "error"
                    );

                    return;
                }


                setButtonLoading(
                    registerBtn,
                    true,
                    "Creating Account..."
                );


                try {

                    const response =
                        await fetch(
                            "/api/signup",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                credentials: "same-origin",

                                body: JSON.stringify({
                                    name,
                                    email,
                                    password
                                })
                            }
                        );


                    let data = {};

                    try {
                        data = await response.json();
                    } catch (_) {
                        data = {};
                    }


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Unable to create account."
                        );
                    }


                    if (
                        data.status &&
                        data.status !== "success"
                    ) {

                        throw new Error(
                            data.message ||
                            "Unable to create account."
                        );
                    }


                    showToast(
                        "Account created successfully. Please sign in.",
                        "success"
                    );


                    /*
                       Switch back to login
                       after successful signup.
                    */

                    document
                        .getElementById("login-email")
                        .value = email;

                    document
                        .getElementById("login-password")
                        .value = "";

                    registerForm.classList.add("hidden");

                    loginForm.classList.remove("hidden");


                    setButtonLoading(
                        registerBtn,
                        false,
                        "Start Earning Now"
                    );


                    setTimeout(() => {

                        document
                            .getElementById("login-password")
                            .focus();

                    }, 150);


                } catch (error) {

                    showToast(
                        error.message ||
                        "Unable to create account. Please try again.",
                        "error"
                    );

                    setButtonLoading(
                        registerBtn,
                        false,
                        "Start Earning Now"
                    );
                }

            }
        );


        /* =========================================
           CHECK EXISTING SESSION
        ========================================== */

        async function checkExistingSession() {

            try {

                const response =
                    await fetch(
                        "/api/me",
                        {
                            method: "GET",
                            credentials: "same-origin"
                        }
                    );

                if (!response.ok) {
                    return;
                }

                const data =
                    await response.json();

                if (
                    data &&
                    data.status === "success" &&
                    data.user
                ) {

                    window.location.href =
                        "/dashboard";
                }

            } catch (_) {
                /*
                    No active session.
                    Stay on login page.
                */
            }
        }


        /* =========================================
           INITIALIZE
        ========================================== */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                checkExistingSession();

            }
        );

    </script>

</body>
</html>
