name = "dashboard"
main = "worker.js"
compatibility_date = "2026-09-18"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
run_worker_first = ["/", "/login", "/index.html", "/privacy", "/terms", "/v1/upload", "/api/*", "/file/*", "/d/*", "/sc_*", "/manage-sites", "/manage-sites.html", "/__scloud_jobs/*", "/dashboard", "/dashboard.html", "/files", "/files.html", "/admin", "/admin.html"]

[[d1_databases]]
binding = "DB"
database_name = "scloud_db"
database_id = "46c54f0b-d47b-4906-94a2-bbd0cb0e82f1"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
